services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finintel-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GROWW_API_KEY=${GROWW_API_KEY:-}
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    container_name: finintel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
